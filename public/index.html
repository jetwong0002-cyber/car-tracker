<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>行车轨迹</title>
<meta name="application-name" content="行车轨迹">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="行车轨迹">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0a84ff">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon.png">
<link rel="icon" href="/favicon.ico">
<link rel="manifest" href="/site.webmanifest">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, sans-serif; }
  #map { height: 100vh; width: 100vw; }
  #panel {
    position: fixed; top: 12px; left: 50%; transform: translateX(-50%);
    z-index: 1000; background: #fff; border-radius: 12px;
    box-shadow: 0 2px 12px rgba(0,0,0,.25); padding: 10px 14px;
    display: flex; gap: 8px; align-items: center; flex-wrap: wrap; justify-content: center;
  }
  input, select, button {
    font-size: 15px; padding: 7px 10px; border: 1px solid #ccc; border-radius: 8px;
  }
  button { background: #0a84ff; color: #fff; border: none; cursor: pointer; }
  #logout { background: #eee; color: #333; }
  #locateBtn {
    position: fixed; right: 14px; bottom: 28px; z-index: 1000;
    width: 44px; height: 44px; border-radius: 50%; padding: 0;
    background: #fff; color: #0a84ff; border: none;
    box-shadow: 0 2px 10px rgba(0,0,0,.28);
    font-size: 20px; line-height: 1; cursor: pointer;
  }
  #locateBtn:disabled { opacity: 0.55; cursor: wait; }
  #locateBtn.locating { color: #999; }
  #info { font-size: 13px; color: #666; width: 100%; text-align: center; }
  .hidden { display: none !important; }
  .me-pulse {
    width: 18px; height: 18px; border-radius: 50%;
    background: #0a84ff; border: 3px solid #fff;
    box-shadow: 0 0 0 2px rgba(10,132,255,.35), 0 2px 6px rgba(0,0,0,.3);
  }
</style>
</head>
<body>
<div id="panel">
  <input type="password" id="token" placeholder="密码" style="width:100px" inputmode="numeric">
  <button id="saveBtn" onclick="saveToken()">进入</button>

  <select id="vehicle" class="hidden"></select>
  <select id="days" class="hidden">
    <option value="1">今天</option>
    <option value="3">最近3天</option>
    <option value="7">最近7天</option>
    <option value="30">最近30天</option>
  </select>
  <button id="loadBtn" class="hidden" onclick="load()">查看</button>
  <button id="logout" class="hidden" onclick="clearToken()">退出</button>
  <div id="info"></div>
</div>
<button id="locateBtn" class="hidden" type="button" title="定位到我（仅点一次才取定位）" aria-label="定位到我" onclick="locateMe()">◎</button>
<div id="map"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
  const map = L.map('map').setView([2.03, 103.32], 12);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '© OpenStreetMap'
  }).addTo(map);

  let layerGroup = L.layerGroup().addTo(map);
  let meMarker = null;
  let locating = false;
  const $ = id => document.getElementById(id);
  const getToken = () => localStorage.getItem('track_token') || '';

  function ui() {
    const has = !!getToken();
    $('token').classList.toggle('hidden', has);
    $('saveBtn').classList.toggle('hidden', has);
    ['vehicle','days','loadBtn','logout','locateBtn'].forEach(id => $(id).classList.toggle('hidden', !has));
  }

  function saveToken() {
    const t = $('token').value.trim();
    if (!t) { alert('请输入密码'); return; }
    localStorage.setItem('track_token', t);
    ui(); initVehicles();
  }

  function clearToken() {
    localStorage.removeItem('track_token');
    if (meMarker) { map.removeLayer(meMarker); meMarker = null; }
    ui();
  }

  async function initVehicles() {
    const res = await fetch('/api/history?list=vehicles&token=' + encodeURIComponent(getToken()));
    if (res.status === 401) { alert('密码错误'); clearToken(); return; }
    const data = await res.json();
    const sel = $('vehicle');
    sel.innerHTML = '';
    const vehicles = data.vehicles || [];
    if (vehicles.length !== 1) {
      const all = document.createElement('option');
      all.value = ''; all.textContent = '全部车辆';
      sel.appendChild(all);
    }
    for (const v of vehicles) {
      const o = document.createElement('option');
      o.value = v; o.textContent = v;
      sel.appendChild(o);
    }
    load();
  }

  const fmtTime = iso => new Date(iso).toLocaleString('zh-MY', {
    month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit', hour12: false
  });

  // Catmull-Rom 样条：把稀疏 GPS 折线插成平滑弧线（转弯不再像折尺）
  function catmullRom(p0, p1, p2, p3, t) {
    const t2 = t * t, t3 = t2 * t;
    return [
      0.5 * ((2 * p1[0]) + (-p0[0] + p2[0]) * t + (2 * p0[0] - 5 * p1[0] + 4 * p2[0] - p3[0]) * t2 + (-p0[0] + 3 * p1[0] - 3 * p2[0] + p3[0]) * t3),
      0.5 * ((2 * p1[1]) + (-p0[1] + p2[1]) * t + (2 * p0[1] - 5 * p1[1] + 4 * p2[1] - p3[1]) * t2 + (-p0[1] + 3 * p1[1] - 3 * p2[1] + p3[1]) * t3),
    ];
  }

  function smoothLatLngs(latlngs, samplesPerSeg = 8) {
    if (latlngs.length < 3) return latlngs.slice();
    const out = [];
    for (let i = 0; i < latlngs.length - 1; i++) {
      const p0 = latlngs[Math.max(0, i - 1)];
      const p1 = latlngs[i];
      const p2 = latlngs[i + 1];
      const p3 = latlngs[Math.min(latlngs.length - 1, i + 2)];
      for (let s = 0; s < samplesPerSeg; s++) {
        out.push(catmullRom(p0, p1, p2, p3, s / samplesPerSeg));
      }
    }
    out.push(latlngs[latlngs.length - 1]);
    return out;
  }

  // 沿线画方向箭头:每隔 N 个点取一段,算角度,放一个旋转的箭头图标
  function addArrows(coords) {
    const step = Math.max(2, Math.floor(coords.length / 8)); // 每段最多约8个箭头
    for (let i = step; i < coords.length; i += step) {
      const [lng1, lat1] = coords[i - 1];
      const [lng2, lat2] = coords[i];
      const angle = Math.atan2(lng2 - lng1, lat2 - lat1) * 180 / Math.PI; // 0=北,顺时针
      const icon = L.divIcon({
        className: '',
        html: '<div style="transform: rotate(' + angle + 'deg); font-size: 16px; color: #0a84ff; text-shadow: 0 0 3px #fff, 0 0 3px #fff;">▲</div>',
        iconSize: [16, 16],
        iconAnchor: [8, 8],
      });
      L.marker([ (lat1+lat2)/2, (lng1+lng2)/2 ], { icon, interactive: false }).addTo(layerGroup);
    }
  }

  // 仅在用户点击「定位」时取一次位置；绝不 watchPosition，避免持续耗电
  function locateMe() {
    if (locating) return;
    if (!navigator.geolocation) {
      alert('当前浏览器不支持定位');
      return;
    }

    locating = true;
    const btn = $('locateBtn');
    btn.disabled = true;
    btn.classList.add('locating');
    const prevInfo = $('info').textContent;
    $('info').textContent = '正在定位…';

    navigator.geolocation.getCurrentPosition(
      (pos) => {
        locating = false;
        btn.disabled = false;
        btn.classList.remove('locating');
        const { latitude, longitude, accuracy } = pos.coords;
        const latlng = [latitude, longitude];

        if (meMarker) map.removeLayer(meMarker);
        const icon = L.divIcon({
          className: '',
          html: '<div class="me-pulse"></div>',
          iconSize: [18, 18],
          iconAnchor: [9, 9],
        });
        meMarker = L.marker(latlng, { icon, zIndexOffset: 1000 })
          .bindPopup('我的位置' + (accuracy ? ' · 约 ±' + Math.round(accuracy) + 'm' : ''))
          .addTo(map)
          .openPopup();

        map.setView(latlng, Math.max(map.getZoom(), 15));
        $('info').textContent = prevInfo || ('已定位 · 约 ±' + Math.round(accuracy || 0) + 'm');
      },
      (err) => {
        locating = false;
        btn.disabled = false;
        btn.classList.remove('locating');
        $('info').textContent = prevInfo;
        const msg = err.code === 1 ? '未授权定位权限'
          : err.code === 2 ? '暂时拿不到位置'
          : err.code === 3 ? '定位超时'
          : '定位失败';
        alert(msg);
      },
      {
        // 低功耗：不强制高精度、允许用最近缓存、短超时；且只用 getCurrentPosition 一次
        enableHighAccuracy: false,
        timeout: 12000,
        maximumAge: 120000,
      }
    );
  }

  async function load() {
    const params = new URLSearchParams({ token: getToken(), days: $('days').value });
    if ($('vehicle').value) params.set('veh', $('vehicle').value);

    $('info').textContent = '加载中…';
    const res = await fetch('/api/history?' + params.toString());
    if (res.status === 401) { alert('密码已失效'); clearToken(); return; }
    if (!res.ok) { $('info').textContent = '加载失败'; return; }
    const data = await res.json();

    layerGroup.clearLayers();
    const features = data.geojson.features || [];
    let bounds = null;

    for (const f of features) {
      const coords = f.geometry.coordinates;
      const raw = coords.map(c => [c[1], c[0]]);
      const latlngs = smoothLatLngs(raw);
      const line = L.polyline(latlngs, { color: '#0a84ff', weight: 4, opacity: 0.85, lineJoin: 'round', lineCap: 'round' })
        .bindPopup('出发 ' + fmtTime(f.properties.start) + '<br>到达 ' + fmtTime(f.properties.end))
        .addTo(layerGroup);

      // 起点绿圆、终点红圆
      L.circleMarker(raw[0], { radius: 7, color: '#fff', weight: 2, fillColor: '#34c759', fillOpacity: 1 })
        .bindPopup('出发 ' + fmtTime(f.properties.start)).addTo(layerGroup);
      L.circleMarker(raw[raw.length-1], { radius: 7, color: '#fff', weight: 2, fillColor: '#ff3b30', fillOpacity: 1 })
        .bindPopup('到达 ' + fmtTime(f.properties.end)).addTo(layerGroup);

      addArrows(coords);
      bounds = bounds ? bounds.extend(line.getBounds()) : line.getBounds();
    }

    if (bounds) {
      map.fitBounds(bounds, { padding: [40, 40] });
      $('info').textContent = data.points + ' 个定位点 · ' + features.length + ' 段行程(绿=出发 红=到达)';
    } else {
      $('info').textContent = '这个时间范围没有轨迹';
    }
  }

  ui();
  if (getToken()) initVehicles();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>行车轨迹</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, sans-serif; }
  #map { height: 100vh; width: 100vw; }
  #panel {
    position: fixed; top: 12px; left: 50%; transform: translateX(-50%);
    z-index: 1000; background: #fff; border-radius: 12px;
    box-shadow: 0 2px 12px rgba(0,0,0,.25); padding: 10px 14px;
    display: flex; gap: 8px; align-items: center; flex-wrap: wrap; justify-content: center;
  }
  input, select, button {
    font-size: 15px; padding: 7px 10px; border: 1px solid #ccc; border-radius: 8px;
  }
  button { background: #0a84ff; color: #fff; border: none; cursor: pointer; }
  #logout { background: #eee; color: #333; }
  #info { font-size: 13px; color: #666; width: 100%; text-align: center; }
  .hidden { display: none !important; }
</style>
</head>
<body>
<div id="panel">
  <!-- 第一次:输 token;之后自动记住 -->
  <input type="password" id="token" placeholder="Token(只需输一次)" style="width:160px">
  <button id="saveBtn" onclick="saveToken()">保存</button>

  <!-- 记住 token 后显示的日常界面 -->
  <select id="vehicle" class="hidden"></select>
  <select id="days" class="hidden">
    <option value="1">今天</option>
    <option value="3">最近3天</option>
    <option value="7">最近7天</option>
    <option value="30">最近30天</option>
  </select>
  <button id="loadBtn" class="hidden" onclick="load()">查看</button>
  <button id="logout" class="hidden" onclick="clearToken()">退出</button>
  <div id="info"></div>
</div>
<div id="map"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
  const map = L.map('map').setView([2.03, 103.32], 12);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '© OpenStreetMap'
  }).addTo(map);

  let layer = null;
  const $ = id => document.getElementById(id);
  const getToken = () => localStorage.getItem('track_token') || '';

  function ui() {
    const has = !!getToken();
    $('token').classList.toggle('hidden', has);
    $('saveBtn').classList.toggle('hidden', has);
    ['vehicle','days','loadBtn','logout'].forEach(id => $(id).classList.toggle('hidden', !has));
  }

  function saveToken() {
    const t = $('token').value.trim();
    if (!t) { alert('请输入 Token'); return; }
    localStorage.setItem('track_token', t);
    ui(); initVehicles();
  }

  function clearToken() {
    localStorage.removeItem('track_token');
    ui();
  }

  async function initVehicles() {
    const res = await fetch('/api/history?list=vehicles&token=' + encodeURIComponent(getToken()));
    if (res.status === 401) { alert('Token 错误'); clearToken(); return; }
    const data = await res.json();
    const sel = $('vehicle');
    sel.innerHTML = '<option value="">全部车辆</option>';
    for (const v of (data.vehicles || [])) {
      const o = document.createElement('option');
      o.value = v; o.textContent = v;
      sel.appendChild(o);
    }
    load(); // 进来直接显示今天
  }

  async function load() {
    const params = new URLSearchParams({ token: getToken(), days: $('days').value });
    if ($('vehicle').value) params.set('veh', $('vehicle').value);

    $('info').textContent = '加载中…';
    const res = await fetch('/api/history?' + params.toString());
    if (res.status === 401) { alert('Token 已失效'); clearToken(); return; }
    if (!res.ok) { $('info').textContent = '加载失败'; return; }
    const data = await res.json();

    if (layer) map.removeLayer(layer);
    layer = L.geoJSON(data.geojson, {
      style: { color: '#0a84ff', weight: 4, opacity: 0.85 }
    }).addTo(map);

    if (data.geojson.features.length > 0) {
      map.fitBounds(layer.getBounds(), { padding: [40, 40] });
      $('info').textContent = `${data.points} 个定位点 · ${data.geojson.features.length} 段轨迹`;
    } else {
      $('info').textContent = '这个时间范围没有轨迹';
    }
  }

  ui();
  if (getToken()) initVehicles();
</script>
</body>
</html>

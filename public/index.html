<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>行车轨迹</title>
<meta name="application-name" content="行车轨迹">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="行车轨迹">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0b1220">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon.png">
<link rel="icon" href="/favicon.ico">
<link rel="manifest" href="/site.webmanifest">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --bg: #0b1220;
    --card: rgba(17, 25, 40, .78);
    --border: rgba(255, 255, 255, .12);
    --text: #e7ecf3;
    --muted: #8b98ac;
    --accent: #00e5ff;
    --accent2: #7c4dff;
    --car: #ff9f0a;
    --sheet-h: 54px;                 /* 行程抽屉收起时的高度,底部控件按它让位 */
  }
  html, body { height: 100%; background: var(--bg); }
  body { font-family: -apple-system, "SF Pro Text", "PingFang SC", "Microsoft YaHei", sans-serif; color: var(--text); }
  #map { height: 100vh; height: 100dvh; width: 100vw; background: var(--bg); }

  /* ---------- 登录卡片 ---------- */
  #loginCard {
    position: fixed; inset: 0; z-index: 2000;
    display: flex; align-items: center; justify-content: center;
    background: radial-gradient(1200px 700px at 30% -10%, rgba(124,77,255,.28), transparent 60%),
                radial-gradient(900px 600px at 90% 110%, rgba(0,229,255,.22), transparent 55%),
                var(--bg);
  }
  .card {
    width: min(88vw, 340px);
    background: var(--card); border: 1px solid var(--border);
    border-radius: 20px; padding: 32px 26px 28px;
    backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
    box-shadow: 0 24px 60px rgba(0,0,0,.5);
    text-align: center;
  }
  .card .logo { font-size: 40px; line-height: 1; }
  .card h1 { font-size: 20px; font-weight: 700; margin: 12px 0 4px; letter-spacing: 2px; }
  .card p  { font-size: 13px; color: var(--muted); margin-bottom: 22px; }
  .card input {
    width: 100%; font-size: 17px; text-align: center; letter-spacing: 4px;
    padding: 12px 14px; border-radius: 12px;
    border: 1px solid var(--border); background: rgba(255,255,255,.06); color: var(--text);
    outline: none; transition: border-color .2s, box-shadow .2s;
  }
  .card input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(0,229,255,.18); }
  .card button {
    width: 100%; margin-top: 14px; padding: 12px; font-size: 16px; font-weight: 600;
    border: none; border-radius: 12px; cursor: pointer; color: #041018;
    background: linear-gradient(135deg, var(--accent), #46ffd4);
    box-shadow: 0 8px 24px rgba(0,229,255,.35);
    transition: transform .15s, box-shadow .15s;
  }
  .card button:active { transform: scale(.97); }
  .card .err { color: #ff6b81; font-size: 13px; min-height: 18px; margin-top: 10px; }

  /* ---------- 顶部控制条 ---------- */
  #panel {
    position: fixed; top: max(12px, env(safe-area-inset-top)); left: 50%; transform: translateX(-50%);
    z-index: 1000; max-width: calc(100vw - 20px);
    background: var(--card); border: 1px solid var(--border); border-radius: 16px;
    backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
    box-shadow: 0 10px 32px rgba(0,0,0,.45);
    padding: 10px 12px;
    display: flex; gap: 8px; align-items: center; flex-wrap: wrap; justify-content: center;
  }
  #panel select, #panel button, #panel input[type=date] {
    font-size: 14px; padding: 8px 12px; border-radius: 10px;
    border: 1px solid var(--border); background: rgba(255,255,255,.06); color: var(--text);
    outline: none; cursor: pointer; font-family: inherit;
  }
  #panel select option { background: #141c2c; color: var(--text); }
  #panel input[type=date]::-webkit-calendar-picker-indicator { filter: invert(.8); cursor: pointer; }
  #loadBtn {
    background: linear-gradient(135deg, var(--accent), #46ffd4) !important;
    color: #041018 !important; border: none !important; font-weight: 700;
  }
  #logout { color: #ff8fa0 !important; }
  .switch { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); user-select: none; cursor: pointer; }
  .switch input { accent-color: var(--accent); width: 16px; height: 16px; cursor: pointer; }
  /* 手机上让控制条铺满宽度,否则 flex 会缩成一根窄柱、控件一行一个,白占大半屏 */
  @media (max-width: 480px) {
    #panel { width: calc(100vw - 16px); padding: 10px 8px; gap: 6px; }
    #panel select, #panel button, #panel input[type=date] { padding: 7px 9px; font-size: 13.5px; }
  }
  #info { font-size: 12.5px; color: var(--muted); width: 100%; text-align: center; }
  #info .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin: 0 3px; vertical-align: middle; }
  .hidden { display: none !important; }

  /* ---------- 行程抽屉 ---------- */
  #sheet {
    position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
    z-index: 1000; width: min(100vw, 560px);
    background: var(--card); border: 1px solid var(--border); border-bottom: none;
    border-radius: 18px 18px 0 0;
    backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
    box-shadow: 0 -8px 30px rgba(0,0,0,.45);
    overflow: hidden;
  }
  #sheetHandle {
    width: 100%; height: var(--sheet-h); padding: 0 16px;
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    background: none; border: none; color: var(--text); font: inherit; font-size: 13.5px;
    cursor: pointer; text-align: left;
  }
  #sheetHandle .chev { color: var(--muted); font-size: 11px; transition: transform .25s ease; flex: none; }
  #sheet.open #sheetHandle .chev { transform: rotate(180deg); }
  #sheetSummary { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #sheetSummary b { color: var(--accent); font-weight: 700; }
  #tripList {
    max-height: 0; overflow: hidden;
    transition: max-height .28s ease;
    padding-bottom: env(safe-area-inset-bottom);
  }
  #sheet.open #tripList { max-height: 45vh; overflow-y: auto; }
  .trip {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 16px; cursor: pointer;
    border-top: 1px solid rgba(255,255,255,.07);
    transition: background .15s;
  }
  .trip:hover { background: rgba(255,255,255,.05); }
  .trip.sel { background: rgba(0,229,255,.12); }
  .trip .swatch { width: 4px; align-self: stretch; min-height: 30px; border-radius: 2px; flex: none; }
  .trip .t1 { font-size: 13.5px; font-weight: 600; }
  .trip .t2 { font-size: 12px; color: var(--muted); margin-top: 2px; }

  /* ---------- 定位按钮 ---------- */
  #locateBtn {
    position: fixed; right: 14px; z-index: 1000;
    bottom: calc(20px + env(safe-area-inset-bottom));
    width: 48px; height: 48px; border-radius: 50%; padding: 0;
    background: var(--card); color: var(--accent);
    border: 1px solid var(--border);
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    box-shadow: 0 6px 20px rgba(0,0,0,.45);
    font-size: 21px; line-height: 1; cursor: pointer;
    transition: bottom .25s ease, opacity .2s;
  }
  #locateBtn:disabled { opacity: .55; cursor: wait; }
  /* 抽屉出现时,底部控件整体上移;抽屉展开时让位隐藏 */
  body.has-sheet #locateBtn { bottom: calc(var(--sheet-h) + 14px + env(safe-area-inset-bottom)); }
  .leaflet-bottom.leaflet-left { transition: bottom .25s ease, opacity .2s; }
  body.has-sheet .leaflet-bottom.leaflet-left { bottom: calc(var(--sheet-h) + env(safe-area-inset-bottom)); }
  body.sheet-open #locateBtn,
  body.sheet-open .leaflet-bottom.leaflet-left { opacity: 0; pointer-events: none; }

  /* ---------- 地图元素 ---------- */
  .me-pulse {
    width: 16px; height: 16px; border-radius: 50%;
    background: var(--accent); border: 3px solid #fff;
    animation: pulse 2s infinite;
  }
  @keyframes pulse {
    0%   { box-shadow: 0 0 0 0 rgba(0,229,255,.65); }
    70%  { box-shadow: 0 0 0 16px rgba(0,229,255,0); }
    100% { box-shadow: 0 0 0 0 rgba(0,229,255,0); }
  }
  .car-pulse {
    width: 18px; height: 18px; border-radius: 50%;
    background: var(--car); border: 3px solid #fff;
    animation: pulseCar 2s infinite;
  }
  @keyframes pulseCar {
    0%   { box-shadow: 0 0 0 0 rgba(255,159,10,.7); }
    70%  { box-shadow: 0 0 0 18px rgba(255,159,10,0); }
    100% { box-shadow: 0 0 0 0 rgba(255,159,10,0); }
  }
  .ep { width: 14px; height: 14px; border-radius: 50%; border: 2.5px solid #fff; box-shadow: 0 2px 8px rgba(0,0,0,.5); }
  .ep.start { background: #34c759; }
  .ep.end   { background: #ff3b30; }
  .park {
    width: 22px; height: 22px; border-radius: 7px;
    background: rgba(17,25,40,.92); border: 2px solid #fff;
    color: #fff; font-size: 13px; font-weight: 700; line-height: 18px; text-align: center;
    box-shadow: 0 2px 8px rgba(0,0,0,.6);
  }
  .arrow { font-size: 15px; text-shadow: 0 0 4px rgba(0,0,0,.9); }

  .leaflet-popup-content-wrapper {
    background: var(--card); color: var(--text);
    border: 1px solid var(--border); border-radius: 12px;
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  }
  .leaflet-popup-tip { background: rgba(17,25,40,.9); }
  .leaflet-popup-content { font-size: 13px; line-height: 1.6; }
  .leaflet-container a.leaflet-popup-close-button { color: var(--muted); }
  .leaflet-control-attribution { background: rgba(11,18,32,.6) !important; color: #67748a !important; }
  .leaflet-control-attribution a { color: #8b98ac !important; }
  .leaflet-bar a { background: var(--card) !important; color: var(--text) !important; border-color: var(--border) !important; }

  /* 加载条 */
  #loadingBar {
    position: fixed; top: 0; left: 0; height: 3px; width: 0%; z-index: 3000;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    box-shadow: 0 0 12px rgba(0,229,255,.8);
    transition: width .3s ease; opacity: 0;
  }
  #loadingBar.on { opacity: 1; }
</style>
</head>
<body>

<div id="loadingBar"></div>

<!-- 登录 -->
<div id="loginCard" class="hidden">
  <div class="card">
    <div class="logo">🛰️</div>
    <h1>行车轨迹</h1>
    <p>输入密码查看车辆轨迹</p>
    <input type="password" id="token" placeholder="••••••" autocomplete="current-password">
    <button id="saveBtn" onclick="saveToken()">进入</button>
    <div class="err" id="loginErr"></div>
  </div>
</div>

<!-- 控制条 -->
<div id="panel" class="hidden">
  <select id="vehicle"></select>
  <select id="days">
    <option value="today">今天</option>
    <option value="yesterday">昨天</option>
    <option value="3">最近3天</option>
    <option value="7">最近7天</option>
    <option value="30">最近30天</option>
    <option value="custom">选择日期…</option>
  </select>
  <input type="date" id="pickDay" class="hidden">
  <label class="switch" title="把轨迹吸附到真实道路"><input type="checkbox" id="snapRoad" checked>贴路</label>
  <label class="switch" title="每分钟刷新一次车辆最新位置"><input type="checkbox" id="autoRefresh">自动刷新</label>
  <button id="loadBtn" onclick="load()">查看</button>
  <button id="logout" onclick="clearToken()">退出</button>
  <div id="info"></div>
</div>

<!-- 行程列表 -->
<div id="sheet" class="hidden">
  <button id="sheetHandle" type="button" onclick="toggleSheet()">
    <span id="sheetSummary"></span>
    <span class="chev">▲</span>
  </button>
  <div id="tripList"></div>
</div>

<button id="locateBtn" class="hidden" type="button" title="定位到我（仅点一次才取定位）" aria-label="定位到我" onclick="locateMe()">◎</button>
<div id="map"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
  // ================== 地图 ==================
  const DEFAULT_VIEW = { center: [2.03, 103.32], zoom: 12 };
  // preferCanvas:看 30 天轨迹时上百条 polyline 走 canvas,比 SVG 省很多
  const map = L.map('map', { zoomControl: false, preferCanvas: true }).setView(DEFAULT_VIEW.center, DEFAULT_VIEW.zoom);
  L.control.zoom({ position: 'bottomleft' }).addTo(map);

  // 深色底图(免费,无需 key);想换回浅色把 dark_all 改成 light_all
  L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
    attribution: '© OpenStreetMap © CARTO', maxZoom: 20
  }).addTo(map);

  const routeLayer = L.layerGroup().addTo(map);   // 所有轨迹相关图层都放这里,退出时一键清空
  let meMarker = null;
  let carMarker = null;      // 车辆最新位置(不放 routeLayer,否则重新查询会被清掉)
  let autoTimer = null;
  let trips = [];            // 当前画出来的行程(给抽屉列表用)
  let locating = false;
  let gen = 0;    // 请求代号:退出登录后 +1,旧请求回来时发现代号不对就直接丢弃,防止"清完又画回来"

  const $ = id => document.getElementById(id);
  const getToken = () => localStorage.getItem('track_token') || '';

  // 每段行程一个霓虹色,循环使用
  const COLORS = ['#00e5ff', '#7c4dff', '#ff9f0a', '#34d399', '#ff5c8a', '#facc15'];
  const ARROW_BUDGET = 120;    // 全图方向箭头总数上限(每个都是一个 DOM marker)
  const PARK_MIN_MS = 10 * 60 * 1000;   // 停车少于 10 分钟不标(和服务端拆段阈值一致)

  // ================== 登录 / 退出 ==================
  function ui() {
    const has = !!getToken();
    $('loginCard').classList.toggle('hidden', has);
    $('panel').classList.toggle('hidden', !has);
    $('locateBtn').classList.toggle('hidden', !has);
  }

  function saveToken() {
    const t = $('token').value.trim();
    if (!t) { $('loginErr').textContent = '请输入密码'; return; }
    localStorage.setItem('track_token', t);
    $('loginErr').textContent = '';
    $('token').value = '';
    ui(); initVehicles();
  }

  function clearToken() {
    gen++;                                        // ① 作废所有还在路上的请求
    localStorage.removeItem('track_token');       // ② 清凭证
    routeLayer.clearLayers();                     // ③ 清全部轨迹/箭头/起终点 —— 之前漏了这一步,标记才会残留
    if (meMarker) { map.removeLayer(meMarker); meMarker = null; }
    if (carMarker) { map.removeLayer(carMarker); carMarker = null; }
    stopAuto();                                   // ④ 停掉自动刷新定时器
    trips = [];
    hideSheet();
    map.closePopup();
    $('vehicle').innerHTML = '';
    $('info').textContent = '';
    setLoading(false);
    map.setView(DEFAULT_VIEW.center, DEFAULT_VIEW.zoom);   // ⑤ 回到默认视角,不暴露最后看过的位置
    ui();
  }

  // ================== 数据 ==================
  async function initVehicles() {
    const myGen = gen;
    let res;
    try {
      res = await fetch('/api/history?list=vehicles&token=' + encodeURIComponent(getToken()));
    } catch { $('info').textContent = '网络错误'; return; }
    if (myGen !== gen) return;                    // 已退出,丢弃
    if (res.status === 401) { localStorage.removeItem('track_token'); ui(); $('loginErr').textContent = '密码错误'; return; }
    const data = await res.json();
    if (myGen !== gen) return;
    const sel = $('vehicle');
    sel.innerHTML = '';
    const vehicles = data.vehicles || [];
    if (vehicles.length !== 1) {
      const all = document.createElement('option');
      all.value = ''; all.textContent = '全部车辆';
      sel.appendChild(all);
    }
    for (const v of vehicles) {
      const o = document.createElement('option');
      o.value = v; o.textContent = v;
      sel.appendChild(o);
    }
    load();
    setAuto($('autoRefresh').checked);
  }

  // ================== 时间 / 数字格式 ==================
  const fmtTime = iso => new Date(iso).toLocaleString('zh-MY', {
    month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit', hour12: false
  });
  const fmtClock = iso => new Date(iso).toLocaleTimeString('zh-MY', {
    hour: '2-digit', minute: '2-digit', hour12: false
  });
  const fmtKm = m => m >= 1000 ? (m / 1000).toFixed(1) + ' km' : Math.round(m) + ' m';

  function fmtDur(ms) {
    const min = Math.round(ms / 60000);
    if (min < 60) return min + ' 分';
    return Math.floor(min / 60) + ' 小时 ' + (min % 60) + ' 分';
  }

  function agoText(iso) {
    const s = (Date.now() - new Date(iso).getTime()) / 1000;
    if (s < 0) return '刚刚';
    if (s < 90) return '刚刚';
    if (s < 3600) return Math.round(s / 60) + ' 分钟前';
    if (s < 86400) return Math.round(s / 3600) + ' 小时前';
    return Math.round(s / 86400) + ' 天前';
  }

  // 本地日历日 YYYY-MM-DD(offset=-1 就是昨天)
  // 注意:不能用 toISOString(),那是 UTC,马来西亚会差 8 小时
  function localDayStr(offset) {
    const d = new Date();
    d.setDate(d.getDate() + (offset || 0));
    const pad = n => String(n).padStart(2, '0');
    return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
  }

  function setLoading(on, pct) {
    const bar = $('loadingBar');
    bar.classList.toggle('on', !!on);
    bar.style.width = on ? (pct || 30) + '%' : '0%';
  }

  // 时间范围 → 查询参数。今天/昨天走 day=(真·日历日),其余走 days=(最近 N 天)
  function rangeParams() {
    const p = new URLSearchParams({ token: getToken() });
    const v = $('days').value;
    if (v === 'today') p.set('day', localDayStr(0));
    else if (v === 'yesterday') p.set('day', localDayStr(-1));
    else if (v === 'custom') {
      const d = $('pickDay').value;
      if (d) p.set('day', d); else p.set('day', localDayStr(0));
    } else p.set('days', v);
    if ($('vehicle').value) p.set('veh', $('vehicle').value);
    return p;
  }

  // ================== GPS 降噪 ==================
  // 过近的点(<8m)和明显飞点先丢掉,贴路成功率会高很多
  function distM(a, b) { // [lng,lat]
    const R = 6371000, dLat = (b[1]-a[1]) * Math.PI/180, dLng = (b[0]-a[0]) * Math.PI/180;
    const s = Math.sin(dLat/2)**2 + Math.cos(a[1]*Math.PI/180) * Math.cos(b[1]*Math.PI/180) * Math.sin(dLng/2)**2;
    return 2 * R * Math.asin(Math.sqrt(s));
  }

  function denoise(coords) {
    if (coords.length < 3) return coords;
    const out = [coords[0]];
    for (let i = 1; i < coords.length - 1; i++) {
      if (distM(out[out.length-1], coords[i]) >= 8) out.push(coords[i]);
    }
    out.push(coords[coords.length-1]);
    return out;
  }

  // 行程里程/时长/均速。用**贴路前的原始点**算,贴路后的线长度会变
  function tripStats(coords, startISO, endISO) {
    let dist = 0;
    for (let i = 1; i < coords.length; i++) dist += distM(coords[i-1], coords[i]);
    const ms = Math.max(0, new Date(endISO).getTime() - new Date(startISO).getTime());
    const hrs = ms / 3600000;
    return { m: dist, ms, kmh: hrs > 0 ? (dist / 1000) / hrs : 0 };
  }

  // ================== OSRM 贴路(map matching) ==================
  const OSRM = 'https://router.project-osrm.org';
  const CHUNK = 90;                               // 公共服务单次上限 100 点,留余量
  const matchCache = new Map();                   // 内存缓存:同一段行程本页内只请求一次

  function cacheKey(coords) {
    const f = coords[0], l = coords[coords.length-1];
    return coords.length + '|' + f[0].toFixed(5) + ',' + f[1].toFixed(5) + '|' + l[0].toFixed(5) + ',' + l[1].toFixed(5);
  }

  // coords: [lng,lat][] → 返回贴合后的 [lat,lng][],失败返回 null(调用方回退平滑直线)
  async function snapToRoad(coords, myGen) {
    const key = cacheKey(coords);
    if (matchCache.has(key)) return matchCache.get(key);

    const pts = denoise(coords);
    if (pts.length < 2) return null;

    const out = [];
    for (let i = 0; i < pts.length - 1; i += CHUNK - 1) {
      const chunk = pts.slice(i, i + CHUNK);
      if (chunk.length < 2) break;
      const cs = chunk.map(p => p[0].toFixed(6) + ',' + p[1].toFixed(6)).join(';');
      const radiuses = chunk.map(() => 35).join(';');   // GPS 误差半径(米),城区 20~50 比较稳
      const url = OSRM + '/match/v1/driving/' + cs
                + '?geometries=geojson&overview=full&tidy=true&radiuses=' + radiuses;
      try {
        const res = await fetch(url);
        if (myGen !== gen) return null;                 // 已退出,放弃
        if (!res.ok) return null;                       // 限流/超长,整段回退
        const data = await res.json();
        if (data.code !== 'Ok' || !data.matchings || !data.matchings.length) return null;
        for (const m of data.matchings) {
          for (const c of m.geometry.coordinates) out.push([c[1], c[0]]);
        }
      } catch { return null; }
    }
    if (out.length < 2) return null;
    matchCache.set(key, out);
    return out;
  }

  // ================== 兜底:Catmull-Rom 平滑(贴路失败时用) ==================
  function catmullRom(p0, p1, p2, p3, t) {
    const t2 = t*t, t3 = t2*t;
    return [
      0.5 * ((2*p1[0]) + (-p0[0]+p2[0])*t + (2*p0[0]-5*p1[0]+4*p2[0]-p3[0])*t2 + (-p0[0]+3*p1[0]-3*p2[0]+p3[0])*t3),
      0.5 * ((2*p1[1]) + (-p0[1]+p2[1])*t + (2*p0[1]-5*p1[1]+4*p2[1]-p3[1])*t2 + (-p0[1]+3*p1[1]-3*p2[1]+p3[1])*t3),
    ];
  }
  function smoothLatLngs(latlngs, samplesPerSeg = 8) {
    if (latlngs.length < 3) return latlngs.slice();
    const out = [];
    for (let i = 0; i < latlngs.length - 1; i++) {
      const p0 = latlngs[Math.max(0, i-1)], p1 = latlngs[i], p2 = latlngs[i+1], p3 = latlngs[Math.min(latlngs.length-1, i+2)];
      for (let s = 0; s < samplesPerSeg; s++) out.push(catmullRom(p0, p1, p2, p3, s/samplesPerSeg));
    }
    out.push(latlngs[latlngs.length-1]);
    return out;
  }

  // ================== 画一段行程:发光双线 + 方向箭头 ==================
  function drawSegment(latlngs, color, popupHtml, arrowCount) {
    // 底层粗透明当光晕,上层实线
    L.polyline(latlngs, { color, weight: 11, opacity: .22, lineJoin: 'round', lineCap: 'round', interactive: false }).addTo(routeLayer);
    const line = L.polyline(latlngs, { color, weight: 4, opacity: .95, lineJoin: 'round', lineCap: 'round' })
      .bindPopup(popupHtml).addTo(routeLayer);
    addArrows(latlngs, color, arrowCount);
    return line;
  }

  function addArrows(latlngs, color, count) {
    if (!count || count < 1 || latlngs.length < 2) return;
    const step = Math.max(2, Math.floor(latlngs.length / (count + 1)));
    for (let i = step; i < latlngs.length; i += step) {
      const [lat1, lng1] = latlngs[i-1];
      const [lat2, lng2] = latlngs[i];
      const angle = Math.atan2(lng2 - lng1, lat2 - lat1) * 180 / Math.PI;
      const icon = L.divIcon({
        className: '',
        html: '<div class="arrow" style="transform:rotate(' + angle + 'deg);color:' + color + '">▲</div>',
        iconSize: [15, 15], iconAnchor: [8, 8],
      });
      L.marker([(lat1+lat2)/2, (lng1+lng2)/2], { icon, interactive: false }).addTo(routeLayer);
    }
  }

  function endpointMarker(latlng, cls, popupHtml) {
    const icon = L.divIcon({ className: '', html: '<div class="ep ' + cls + '"></div>', iconSize: [14,14], iconAnchor: [7,7] });
    L.marker(latlng, { icon }).bindPopup(popupHtml).addTo(routeLayer);
  }

  // 相邻两段行程之间就是一次停车,数据已有,纯前端算
  function drawParking() {
    for (let i = 0; i < trips.length - 1; i++) {
      const from = trips[i], to = trips[i+1];
      const ms = new Date(to.start).getTime() - new Date(from.end).getTime();
      if (ms < PARK_MIN_MS) continue;
      const icon = L.divIcon({
        className: '',
        html: '<div class="park">P</div>',
        iconSize: [22, 22], iconAnchor: [11, 28],   // 往上抬,别压住红色的到达点
      });
      L.marker(from.endLatLng, { icon })
        .bindPopup('<b>停车 ' + fmtDur(ms) + '</b><br>' + fmtTime(from.end) + ' → ' + fmtTime(to.start))
        .addTo(routeLayer);
    }
  }

  // ================== 行程抽屉 ==================
  function toggleSheet() {
    const open = $('sheet').classList.toggle('open');
    document.body.classList.toggle('sheet-open', open);
  }

  function hideSheet() {
    $('sheet').classList.add('hidden');
    $('sheet').classList.remove('open');
    document.body.classList.remove('has-sheet', 'sheet-open');
    $('tripList').innerHTML = '';
  }

  function renderSheet() {
    if (!trips.length) { hideSheet(); return; }

    const totM = trips.reduce((s, t) => s + t.stats.m, 0);
    const totMs = trips.reduce((s, t) => s + t.stats.ms, 0);
    $('sheetSummary').innerHTML =
      '<b>' + trips.length + '</b> 段行程 · <b>' + fmtKm(totM) + '</b> · ' + fmtDur(totMs);

    const list = $('tripList');
    list.innerHTML = '';
    trips.forEach((t, i) => {
      const row = document.createElement('div');
      row.className = 'trip';
      row.innerHTML =
        '<span class="swatch" style="background:' + t.color + '"></span>' +
        '<div><div class="t1">' + fmtTime(t.start) + ' → ' + fmtClock(t.end) + '</div>' +
        '<div class="t2">' + fmtKm(t.stats.m) + ' · ' + fmtDur(t.stats.ms) +
        ' · 均速 ' + Math.round(t.stats.kmh) + ' km/h</div></div>';
      row.onclick = () => selectTrip(i);
      list.appendChild(row);
    });

    $('sheet').classList.remove('hidden');
    document.body.classList.add('has-sheet');
  }

  function selectTrip(i) {
    const t = trips[i];
    if (!t) return;
    [...$('tripList').children].forEach((el, k) => el.classList.toggle('sel', k === i));
    map.fitBounds(t.line.getBounds(), { padding: [50, 50] });
    t.line.openPopup();
  }

  // ================== 主加载 ==================
  async function load() {
    const myGen = gen;
    if (!getToken()) return;

    $('info').textContent = '加载中…';
    setLoading(true, 20);
    let res;
    try {
      res = await fetch('/api/history?' + rangeParams().toString());
    } catch { if (myGen === gen) { $('info').textContent = '网络错误'; setLoading(false); } return; }
    if (myGen !== gen) return;
    if (res.status === 401) { setLoading(false); clearToken(); $('loginErr').textContent = '密码已失效'; return; }
    if (!res.ok) { $('info').textContent = '加载失败'; setLoading(false); return; }
    const data = await res.json();
    if (myGen !== gen) return;

    routeLayer.clearLayers();
    trips = [];
    const features = (data.geojson && data.geojson.features) || [];
    const useSnap = $('snapRoad').checked;
    let bounds = null;
    let snapped = 0;

    // 段数多时每段少画箭头,避免铺出上千个 DOM marker
    const arrowsPerSeg = features.length ? Math.min(8, Math.floor(ARROW_BUDGET / features.length)) : 0;

    for (let idx = 0; idx < features.length; idx++) {
      if (myGen !== gen) return;                  // 中途退出立即停手
      const f = features[idx];
      const coords = f.geometry.coordinates;       // [lng,lat][] 原始点
      const color = COLORS[idx % COLORS.length];
      const st = tripStats(coords, f.properties.start, f.properties.end);
      const popup = '<b>行程 ' + (idx+1) + '</b><br>出发 ' + fmtTime(f.properties.start)
                  + '<br>到达 ' + fmtTime(f.properties.end)
                  + '<br>' + fmtKm(st.m) + ' · ' + fmtDur(st.ms)
                  + ' · 均速 ' + Math.round(st.kmh) + ' km/h';

      let latlngs = null;
      if (useSnap) {
        setLoading(true, 25 + Math.round(60 * idx / Math.max(1, features.length)));
        latlngs = await snapToRoad(coords, myGen);
        if (myGen !== gen) return;
        if (latlngs) snapped++;
      }
      if (!latlngs) latlngs = smoothLatLngs(coords.map(c => [c[1], c[0]]));   // 贴路失败 → 平滑折线兜底

      const line = drawSegment(latlngs, color, popup, arrowsPerSeg);
      const raw = coords.map(c => [c[1], c[0]]);
      endpointMarker(raw[0], 'start', '出发 ' + fmtTime(f.properties.start));
      endpointMarker(raw[raw.length-1], 'end', '到达 ' + fmtTime(f.properties.end));
      bounds = bounds ? bounds.extend(line.getBounds()) : line.getBounds();

      trips.push({
        line, color,
        start: f.properties.start, end: f.properties.end,
        stats: st, endLatLng: raw[raw.length-1],
      });
    }

    setLoading(false);
    if (myGen !== gen) return;

    drawParking();
    renderSheet();

    if (bounds) {
      map.fitBounds(bounds, { padding: [40, 40] });
      let txt = data.points + ' 个定位点 · ' + features.length + ' 段行程';
      txt += useSnap ? (' · ' + snapped + '/' + features.length + ' 段已贴路') : '';
      $('info').innerHTML = txt +
        ' <span class="dot" style="background:#34c759"></span>出发' +
        ' <span class="dot" style="background:#ff3b30"></span>到达';
    } else {
      $('info').textContent = '这个时间范围没有轨迹';
    }

    loadLatest();     // 顺手更新一次"车在哪"
  }

  // ================== 车辆最新位置("车在哪") ==================
  async function loadLatest() {
    const myGen = gen;
    if (!getToken()) return;
    const p = new URLSearchParams({ token: getToken(), latest: '1' });
    if ($('vehicle').value) p.set('veh', $('vehicle').value);

    let res;
    try { res = await fetch('/api/history?' + p.toString()); } catch { return; }
    if (myGen !== gen || !res.ok) return;
    const data = await res.json();
    if (myGen !== gen || !getToken()) return;

    const t = data.latest;
    if (!t) return;

    const latlng = [t.lat, t.lng];
    const html = '<b>' + (t.vehicle || '车辆') + '</b><br>最后上报 ' + agoText(t.recorded_at)
               + '<br>' + fmtTime(t.recorded_at)
               + (t.battery != null ? '<br>电量 ' + Math.round(t.battery > 1 ? t.battery : t.battery * 100) + '%' : '');

    if (carMarker) {
      carMarker.setLatLng(latlng).setPopupContent(html);
    } else {
      const icon = L.divIcon({ className: '', html: '<div class="car-pulse"></div>', iconSize: [18,18], iconAnchor: [9,9] });
      carMarker = L.marker(latlng, { icon, zIndexOffset: 900 }).bindPopup(html).addTo(map);
    }
  }

  // ================== 自动刷新 ==================
  function stopAuto() {
    if (autoTimer) { clearInterval(autoTimer); autoTimer = null; }
  }

  function setAuto(on) {
    stopAuto();
    if (on && getToken()) {
      autoTimer = setInterval(() => {
        if (document.hidden) return;      // 页面在后台就跳过这一轮
        loadLatest();
      }, 60000);
    }
  }

  document.addEventListener('visibilitychange', () => {
    // 切回前台立刻补一次,不用干等到下一个整分钟
    if (!document.hidden && $('autoRefresh').checked && getToken()) loadLatest();
  });

  // ================== 定位(仅点按时取一次,不 watch) ==================
  function locateMe() {
    if (locating) return;
    if (!navigator.geolocation) { alert('当前浏览器不支持定位'); return; }
    locating = true;
    const btn = $('locateBtn');
    btn.disabled = true;
    const prevInfo = $('info').textContent;
    $('info').textContent = '正在定位…';

    navigator.geolocation.getCurrentPosition(
      (pos) => {
        locating = false; btn.disabled = false;
        if (!getToken()) return;                   // 定位回来前已退出,不画
        const { latitude, longitude, accuracy } = pos.coords;
        const latlng = [latitude, longitude];
        if (meMarker) map.removeLayer(meMarker);
        const icon = L.divIcon({ className: '', html: '<div class="me-pulse"></div>', iconSize: [16,16], iconAnchor: [8,8] });
        meMarker = L.marker(latlng, { icon, zIndexOffset: 1000 })
          .bindPopup('我的位置' + (accuracy ? ' · 约 ±' + Math.round(accuracy) + 'm' : ''))
          .addTo(map).openPopup();
        map.setView(latlng, Math.max(map.getZoom(), 15));
        $('info').textContent = prevInfo || ('已定位 · 约 ±' + Math.round(accuracy || 0) + 'm');
      },
      (err) => {
        locating = false; btn.disabled = false;
        $('info').textContent = prevInfo;
        alert(err.code === 1 ? '未授权定位权限' : err.code === 2 ? '暂时拿不到位置' : err.code === 3 ? '定位超时' : '定位失败');
      },
      { enableHighAccuracy: false, timeout: 12000, maximumAge: 120000 }
    );
  }

  // ================== 事件绑定 ==================
  $('token').addEventListener('keydown', e => { if (e.key === 'Enter') saveToken(); });

  $('days').addEventListener('change', () => {
    const custom = $('days').value === 'custom';
    $('pickDay').classList.toggle('hidden', !custom);
    if (custom) {
      if (!$('pickDay').value) $('pickDay').value = localDayStr(0);
      $('pickDay').focus();
    }
    load();
  });
  $('pickDay').addEventListener('change', load);
  $('vehicle').addEventListener('change', load);
  $('snapRoad').addEventListener('change', load);
  $('autoRefresh').addEventListener('change', e => setAuto(e.target.checked));

  ui();
  if (getToken()) initVehicles();
</script>
</body>
</html>
